<style>
:root{
  --bg:#e8e0cc; --surface:#f0e9d6; --surface-2:#e2d9c2; --border:#a89c82;
  --text:#3a3228; --text-2:#5c5243; --text-3:#8a7f6b;
  --accent:#4a3f30; --accent-2:#6b5d48; --accent-soft:rgba(74,63,48,.12);
  --danger:#8a3a2a; --success:#4a6b3a;
  --pencil:#3a3228; --pencil-soft:rgba(58,50,40,.14); --ink:#2c241a;
  --water-stain:rgba(120,100,70,.08); --coffee:rgba(139,90,43,.14);
  --radius:6px; --radius-lg:10px; --safe-bottom:env(safe-area-inset-bottom, 0px);
  --dock-h:56px;
  --main-font: 'Caveat', 'Comic Sans MS', 'Segoe Print', 'Bradley Hand',
               'Noto Sans KR', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic',
               'Malgun Gothic', cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
body{
  font-family:var(--main-font);
  font-size:17px;line-height:1.5;letter-spacing:.2px;
  color:var(--text);
  background-color:#e8e0cc;
  background-image:
    linear-gradient(rgba(120,100,70,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,100,70,.12) 1px, transparent 1px),
    linear-gradient(transparent 0, transparent calc(33% - 1px), rgba(120,100,70,.18) calc(33% - 1px), rgba(120,100,70,.18) 33%, transparent 33%, transparent 100%),
    radial-gradient(ellipse 300px 200px at 85% 8%, var(--water-stain), transparent 70%),
    radial-gradient(ellipse 250px 180px at 12% 92%, var(--water-stain), transparent 70%),
    radial-gradient(circle at 92% 88%, transparent 0 22px, rgba(139,90,43,.10) 23px 25px, transparent 26px),
    radial-gradient(circle 3px at 72% 42%, rgba(58,50,40,.32), transparent 70%),
    radial-gradient(circle 2px at 34% 88%, rgba(58,50,40,.28), transparent 70%),
    radial-gradient(circle 2.5px at 92% 66%, rgba(58,50,40,.26), transparent 70%),
    radial-gradient(circle 1.5px at 18% 22%, rgba(58,50,40,.30), transparent 70%),
    radial-gradient(circle 1.8px at 55% 15%, rgba(58,50,40,.22), transparent 70%);
  background-size:20px 20px, 20px 20px, 100% 100%, auto, auto, auto, auto, auto, auto, auto, auto;
  overflow-x:hidden;min-height:100dvh;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background: radial-gradient(ellipse 400px 200px at 0% 0%, rgba(120,100,70,.10), transparent 60%), radial-gradient(ellipse 400px 200px at 100% 100%, rgba(120,100,70,.10), transparent 60%);
  mix-blend-mode:multiply;
}
body::after{ content:'';position:fixed;inset:0;pointer-events:none;z-index:0; box-shadow:inset 0 0 100px rgba(120,100,70,.08); }
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px}

html.font-print {
  --main-font: 'Roboto', 'Helvetica Neue', Arial,
               'Noto Sans KR', 'Noto Sans JP', sans-serif;
}
html.font-print body { font-size: 15px; letter-spacing: 0; }
html.font-print .post-text { font-size: 16px; line-height: 1.5; }
html.font-print .btn-block, html.font-print .tile-btn, html.font-print .field-label, html.font-print .input, html.font-print .select { letter-spacing: 0; }
html.font-print .logo, html.font-print .card-title, html.font-print .sheet h2, html.font-print .profile-name { font-weight: 700; letter-spacing: -0.5px; }

.tile-btn{
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent; color:var(--text-2);
  font-family:var(--main-font);font-size:15px;font-weight:600;
  text-align:center;padding:8px 10px;white-space:nowrap;user-select:none;
  transform:none; transition:transform .15s cubic-bezier(.34,1.56,.64,1),color .15s;
  position:relative;
}
.tile-btn:active{transform:translate(1px,2px) scale(.97);color:var(--ink)}
.tile-btn.primary{color:var(--pencil);font-weight:700}

.btn-block{
  display:flex;align-items:center;justify-content:center;
  padding:10px 16px; font-size:17px;font-weight:600;
  background:var(--surface); color:var(--text);
  width:100%;margin-top:8px; font-family:var(--main-font);
  border-radius:14px 8px 16px 6px / 8px 14px 6px 18px;
  border:none; outline:2.5px solid var(--pencil); outline-offset:-4px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .15s;
  position:relative; filter:url(#pencilWobble);
}
.btn-block.primary{background:var(--pencil);color:var(--surface);outline-color:var(--pencil)}
.btn-block.danger{background:var(--surface);color:var(--danger);outline-color:var(--danger)}
.btn-block.ghost{background:transparent;color:var(--text-2);outline-color:var(--text-3)}
.btn-block:active{transform:translate(1px,2px) scale(.98);background:var(--surface-2)}
.btn-block.tab-active { background: var(--pencil) !important; color: var(--surface) !important; outline-color: var(--pencil) !important; }
.btn-block:disabled { opacity: .45; cursor: not-allowed; }

.input,.select{
  width:100%;background:transparent; border:none;
  border-bottom:2.5px dashed var(--pencil); border-radius:0;
  color:var(--text); padding:6px 4px; font-size:17px; font-family:var(--main-font);
}
.input:focus,.select:focus{background:var(--pencil-soft);border-bottom-style:solid;outline:none}
.field-label{ display:block;font-size:14px;color:var(--pencil); font-weight:700;margin:10px 0 4px; font-family:var(--main-font); }

.app-header{
  position:sticky;top:0;z-index:50;background:rgba(232,224,204,.94);
  position:relative;backdrop-filter:blur(6px);
}
.app-header::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:3.5px;
  background:repeating-linear-gradient(90deg,var(--pencil) 0 10px, transparent 10px 13px);
  filter:url(#pencilWobble);
}
.app-header .wrap{display:flex;align-items:center;justify-content:space-between;padding:11px 16px}
.logo{ font-family:var(--main-font);font-size:24px; color:var(--pencil); font-weight:700; }

.view{display:none;padding:0 14px 160px;max-width:640px;margin:0 auto;position:relative;z-index:1}
.view.active{display:block;animation:pageTurn .3s ease}

.card{background:transparent;border:none;padding:16px 0;margin-bottom:12px;position:relative}
.card-title{
  font-family:var(--main-font);font-size:26px;
  font-weight:700;color:var(--pencil);
  margin-bottom:16px; display:inline-block;position:relative;z-index:2;
}
.card-title::after{
  content:'';display:block;height:12px;margin-top:-6px;width:95%;
  background:rgba(58,50,40,.15);
  border-radius:40% 60% 30% 70% / 50% 40% 60% 50%;
  filter:url(#roughEdge);
  position:absolute;bottom:-4px;left:2%;z-index:-1;transform:rotate(-1deg);
}

.post{
  background:var(--surface); border-radius:12px 8px 14px 6px / 8px 12px 6px 16px;
  padding:16px 18px;margin-bottom:18px;
  outline:3px solid var(--pencil); outline-offset:-4px;
  position:relative;
  filter:url(#pencilStrong);
}
.post::before{
  content:'';position:absolute;inset:-6px;pointer-events:none;z-index:-1;
  border:2px solid var(--pencil);border-radius:14px 10px 16px 8px / 10px 14px 8px 18px;
  opacity:0.4; transform:rotate(-.5deg); filter:url(#pencilWobble);
}
.post.summary{background:#eef0e4;outline-color:var(--success)}
.post.verdict{background:#f1ece0;outline-color:var(--accent-2)}
.post.paused {opacity: 0.55;}
.post.paused > * { filter: grayscale(0.6); }
.post-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.avatar{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  background:var(--surface-2); border:2.5px solid var(--pencil); cursor:pointer;
  filter:url(#pencilWobble);
}
.avatar.human{border-color:var(--danger)}
.avatar.ai{border-color:var(--pencil)}
.post-info{flex:1;min-width:0}
.post-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:pointer;color:var(--pencil)}
.post-sub{font-size:13px;color:var(--text-3);margin-top:2px;font-style:italic;font-family:var(--main-font)}
.post-time{font-size:13px;color:var(--text-3);white-space:nowrap;font-family:var(--main-font);font-style:italic}
.badge{
  display:inline-block;padding:1px 7px;border-radius:6px;
  font-size:12px;font-weight:700;font-family:var(--main-font);
  border:1.5px solid var(--pencil);background:var(--surface-2);
}
.badge.human{border-color:var(--danger);color:var(--danger)}
.badge.success{border-color:var(--success);color:var(--success)}
.post-text{font-size:18px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;margin-bottom:8px;color:var(--text);font-family:var(--main-font)}
.post.summary .post-text,.post.verdict .post-text{font-weight:600}
.post-image{width:100%;border-radius:8px;margin-bottom:8px;display:block;border:1.5px solid var(--pencil)}
.mention{color:var(--danger);font-weight:700;cursor:pointer;text-decoration:underline}

.reactions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.react{
  background:var(--surface-2);border:1.5px solid var(--pencil);border-radius:14px;
  padding:3px 10px;font-size:14px;display:flex;align-items:center;gap:4px;color:var(--text-2);
  min-height:30px;font-family:var(--main-font); filter:url(#pencilWobble);
}
.react.active{background:var(--pencil);color:var(--surface);border-color:var(--pencil)}
.react-count{font-size:12px;font-weight:700;font-family:var(--main-font)}

.ask-btn, .copy-btn, .ai-toggle-btn {
  background: transparent; color:var(--accent); border: 1.5px solid var(--accent);
  border-radius: 10px; padding: 3px 10px; font-size: 14px; font-weight: 700;
  margin-left: 8px; transition: background 0.15s; filter:url(#pencilWobble);
  font-family: var(--main-font);
}
.ask-btn:active, .copy-btn:active, .ai-toggle-btn:active { background: var(--accent-soft); }
.ai-toggle-btn.paused { color: var(--success); border-color: var(--success); background: rgba(74,107,58,0.1); }

.divider{text-align:center;padding:16px 0;font-size:15px;color:var(--text-3);font-family:var(--main-font);font-style:italic;margin:8px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:30%;height:2px;background:var(--pencil);opacity:.3;filter:url(#pencilWobble)}
.divider::before{left:0}.divider::after{right:0}
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.55}
.empty-text{font-size:18px;line-height:1.5;font-style:italic;font-family:var(--main-font)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--surface-2);border:1.5px solid var(--pencil);border-radius:8px;
  padding:5px 12px;font-size:16px;display:inline-flex;align-items:center;gap:6px;
  min-height:34px;font-family:var(--main-font);
}
.chip small{color:var(--text-3);font-size:12px;font-family:var(--main-font)}
.chip-x{color:var(--text-3);font-size:17px;padding:0 2px;cursor:pointer;font-weight:bold}

.fab {
  position: fixed; bottom: calc(70px + var(--safe-bottom)); left: 33.33%;
  transform: translateX(-50%); width: 68px; height: 68px;
  background: var(--surface); border-radius: 50%; outline: 3px solid var(--pencil); outline-offset: -4px;
  z-index: 60; display: flex; align-items: center; justify-content: center;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  box-shadow: 0 4px 10px rgba(58,50,40,.15); filter: url(#pencilWobble);
}
.fab:active { transform: translateX(-50%) scale(.94); background: var(--surface-2); }
.fab-text { font-family: var(--main-font); color: var(--pencil); font-size: 13px; font-weight: 700; white-space: nowrap; letter-spacing: -0.5px; padding: 0 4px; }
.fab.hidden { display: none !important; }

#globalPlayPauseBtn {
  position: fixed; bottom: calc(78px + var(--safe-bottom)); left: 66.66%;
  transform: translateX(-50%); width: 48px; height: 48px; border-radius: 50%;
  background: var(--surface); outline: 2.5px solid var(--pencil); outline-offset: -3px;
  display: flex; align-items: center; justify-content: center; z-index: 60;
  box-shadow: 0 3px 8px rgba(58,50,40,.15); transition: transform 0.2s, background 0.2s, outline-color 0.2s;
  filter: url(#pencilWobble);
}
#globalPlayPauseBtn.hidden { display: none !important; }
#globalPlayPauseBtn:active { animation: none; transform: translateX(-50%) scale(.94); }
.play-icon { font-size: 20px; color: var(--pencil); line-height: 1; transform: translateX(1px); }
.icon-stop { display: none; width: 18px; height: 18px; background: #fff; border-radius: 4px; position: relative; z-index: 2; pointer-events: none; }
.icon-stop::before, .icon-stop::after { content: ''; position: absolute; top: 4px; bottom: 4px; width: 3px; background: var(--danger); border-radius: 1px; }
.icon-stop::before { left: 4px; }
.icon-stop::after { right: 4px; }

@keyframes swing { 0% { transform: translateX(-50%) rotate(-10deg); } 50% { transform: translateX(-50%) rotate(10deg); } 100% { transform: translateX(-50%) rotate(-10deg); } }
#globalPlayPauseBtn.swinging { animation: swing 2s ease-in-out infinite; }
#globalPlayPauseBtn.stopped { background: var(--surface); outline-color: var(--pencil); }
#globalPlayPauseBtn.stopped .play-icon { display: none; }
#globalPlayPauseBtn.stopped .icon-stop { display: block; }

.nav{
  position:fixed;bottom:0;left:0;right:0;background:rgba(232,224,204,.96);
  border-top:3px dashed var(--pencil);display:flex;z-index:70;
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px);
}
.nav-btn{
  flex:1;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--text-3);font-size:13px;font-weight:600;font-family:var(--main-font);min-height:56px;
}
.nav-btn .ico{font-size:20px;line-height:1}
.nav-btn.active{color:var(--pencil);font-weight:700}

.sheet-overlay{
  position:fixed;inset:0;background:rgba(58,50,40,.55);z-index:2000;
  display:flex;align-items:flex-end;justify-content:center;animation:fadeInOverlay .2s ease-out;
}
.sheet{
  background:var(--surface);
  background-image: linear-gradient(rgba(120,100,70,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(120,100,70,.08) 1px, transparent 1px);
  background-size:20px 20px; width:100%;max-width:520px;
  border-radius:16px 12px 0 0; outline:3px solid var(--pencil); outline-offset:-4px;
  padding:18px 16px calc(var(--dock-h) + 40px + var(--safe-bottom));
  max-height:90vh;overflow-y:auto; animation:pullSheet .32s ease forwards;
  position:relative; filter:url(#pencilWobble);
}
.sheet h2{
  font-family:var(--main-font);font-size:26px;
  font-weight:700;margin-bottom:14px;padding-left:2px; padding-right: 48px;
  color:var(--pencil);line-height:1.3; position:relative;
}
.sheet h2::after{
  content:'';display:block;height:10px;margin-top:-4px;width:70%;
  background:rgba(58,50,40,.15);border-radius:30% 70% 40% 60% / 50% 30% 70% 50%;
  filter:url(#roughEdge); position:absolute;bottom:0;left:0;z-index:-1;transform:rotate(-1deg);
}

.sheet-close {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: none; border-radius: 50%;
  color: var(--pencil); font-size: 22px; font-weight: 700; cursor: pointer;
  outline: 2.5px solid var(--pencil); outline-offset: -3px;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .15s;
  filter: url(#pencilWobble); z-index: 10; line-height: 1; padding-bottom: 2px;
}
.sheet-close:active { transform: scale(.9) rotate(8deg); background: var(--surface-2); }

.toast-root{position:fixed;left:0;right:0;bottom:calc(140px + var(--safe-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.toast{
  background:var(--surface);color:var(--text);
  padding:11px 18px;border-radius:12px; font-size:17px;font-weight:600;
  outline:2.5px solid var(--pencil);outline-offset:-3px;
  animation:pencilIn .25s ease forwards; font-family:var(--main-font);position:relative;
  box-shadow:0 4px 12px rgba(58,50,40,.15); filter:url(#pencilWobble);
}
.toast.error{color:var(--danger);outline-color:var(--danger)}
.toast.success{color:var(--success);outline-color:var(--success)}

.profile-head{text-align:center;padding:16px 0 20px;border-bottom:2.5px dashed var(--pencil);margin-bottom:16px}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;
  border:3px solid var(--pencil);background:var(--surface-2); filter:url(#pencilWobble);
}
.profile-avatar.human{border-color:var(--danger)}
.profile-name{font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-family:var(--main-font);color:var(--pencil)}
.profile-role{font-size:14px;color:var(--text-2);margin-top:6px;font-style:italic;font-family:var(--main-font)}
.stats{display:flex;justify-content:center;gap:32px;margin-top:16px}
.stats>div{text-align:center}
.stats b{display:block;font-size:18px;color:var(--text);font-family:var(--main-font)}
.stats span{font-size:11px;color:var(--text-3);text-transform:uppercase;font-family:var(--main-font)}
.profile-post{
  background:var(--surface-2);border:1.5px solid var(--pencil);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;font-size:16px;line-height:1.4;font-family:var(--main-font);
  filter:url(#pencilWobble);
}
.profile-post-time{font-size:11px;color:var(--text-3);margin-bottom:4px;font-family:var(--main-font);font-style:italic}
.help-content{font-size:15px;line-height:1.6;color:var(--text-2);font-family:var(--main-font)}
.help-content h3{font-size:18px;color:var(--pencil);margin:16px 0 8px;font-weight:700;font-family:var(--main-font)}
.help-content p{margin-bottom:8px}
.help-content ul{padding-left:20px;margin-bottom:8px}
.help-content a{color:var(--danger);text-decoration:underline}
.help-content .tip{background:var(--surface-2);border-left:3px solid var(--pencil);padding:12px;border-radius:4px;margin:12px 0;font-size:14px}

.notebook-card {
  background: #fbf8eb; border: 2px solid var(--pencil);
  border-radius: 12px 8px 14px 6px;
  padding: 12px; margin-bottom: 16px; position: relative;
  filter:url(#pencilWobble);
}
.notebook-card::before {
  content: ''; position: absolute; left: 26px; top: 0; bottom: 0;
  width: 1.5px; background: rgba(138,58,42,.3);
}
.note-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.note-item {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  background: var(--surface); padding: 8px 10px 8px 30px;
  border-radius: 6px; border: 1.5px dashed var(--pencil); position: relative;
}
.note-text { flex: 1; font-size: 16px; line-height: 1.3; word-break: break-word; white-space: pre-wrap; font-family:var(--main-font); }
.note-del { color: var(--danger); font-size: 18px; padding: 0 4px; cursor: pointer; background: none; border: none; flex-shrink: 0; }
.note-del:active { transform: scale(0.9); }

.hidden{display:none !important}
.hint{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.4;font-family:var(--main-font);font-style:italic}

@keyframes pencilIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pullSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pageTurn{from{opacity:.6}to{opacity:1}}
@keyframes fadeInOverlay{from{opacity:0}to{opacity:1}}

html.dark{
  --bg:#1c1814; --surface:#2a241d; --surface-2:#3a3228; --border:#7a6b52;
  --text:#f2ead6; --text-2:#d6cbb4; --text-3:#a89c82;
  --accent:#f2ead6; --accent-2:#d6cbb4; --accent-soft:rgba(242,234,214,.14);
  --danger:#ff8a6b; --success:#a6d47a;
  --pencil:#f2ead6; --pencil-soft:rgba(242,234,214,.16); --ink:#fff6e2;
}
html.dark body{

    <filter id="pencilWobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pencilStrong" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
    <filter id="roughEdge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="noise"/>

</svg>

<header class="app-header">

    <div class="logo" data-i18n="logo">AI-Net</div>
    <button class="tile-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<main>
  <section id="view-feed" class="view active">
    <div class="card" style="padding-bottom:0;">
      <div class="card-title" style="cursor:pointer;" onclick="toggleTopicCard()">

        <span id="topicToggleIcon" style="float:right;">▼</span>
      </div>
      <div id="topicCardContent" style="display:none; padding-bottom:16px;">
        <div id="currentTopicBox" style="margin-bottom:12px; background:var(--surface-2); padding:10px 14px; border-radius:10px; border:2px solid var(--pencil); filter:url(#pencilWobble);"></div>
        <textarea id="topic" class="input" data-i18n="topicPlaceholder" placeholder="Задай новую тему..." rows="1" maxlength="200" style="min-height:40px;"></textarea>
        <button class="btn-block primary" data-i18n="setTopic" onclick="startTopic()" style="margin-top:12px;">🎬 Задать тему</button>
        <button class="btn-block ghost" data-i18n="nextTopic" onclick="nextTopic()" style="margin-top:8px; font-size:15px;">⏭ Следующая тема (из блокнота)</button>
      </div>
    </div>

    <div class="card" style="padding-bottom:0;">
      <div class="card-title alt" style="cursor:pointer;" onclick="toggleArena()">

      </div>
      <div id="arenaContent" style="display:none; padding-bottom:16px;">
        <select id="arenaMode" class="select" onchange="updateArenaUI()">
          <option value="text_duel" data-i18n="arenaModeTextDuel">⚔️ Текстовый спор (Дуэль)</option>
          <option value="poetry" data-i18n="arenaModePoetry">📜 Дуэль поэтов</option>

function t(key) { return (UI[currentUILang] && UI[currentUILang][key]) || (UI.ru[key]) || key; }

function applyI18nToDOM() {
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
      el.placeholder = t(key);
    } else {
      el.textContent = t(key);
    }
  });
}

function safeParse(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    const val = JSON.parse(raw);
    if (Array.isArray(fallback) && !Array.isArray(val)) return fallback;
    if (fallback === null && val !== null && typeof val !== 'object') return fallback;
    return val;
  } catch { return fallback; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { toast(t('storageFull'), 'error'); console.warn(e); return false; }
}

  posts.push(post);

  while (posts.length > POSTS_LIMIT) { posts.shift(); removed++; }
  if (removed > 0) toast(t('postsLimitReached') + removed);

  trimHeavyPosts();
  savePosts(); renderFeed();
  if (post.authorType === 'ai' && Math.random() < 0.4) {
    const emojis = ['❤️','👍','🤔','😂'];
    aiReactToPost(post.name, emojis[Math.floor(Math.random() * emojis.length)]);
  }
}
function trimHeavyPosts() {
  try {
    let total = JSON.stringify(posts).length;
    if (total < MEDIA_LIMIT) return;
    let trimmed = false;
    for (let i = 0; i < posts.length && total > MEDIA_LIMIT * 0.85; i++) {
      const p = posts[i];
      if (p.imageUrl && p.imageUrl.startsWith('data:')) { p.imageUrl = ''; p.text = (p.text||'') + ' 🖼️'; trimmed = true; }
      if (p.audioUrl && p.audioUrl.startsWith('data:')) { p.audioUrl = ''; p.text = (p.text||'') + ' 🎵'; trimmed = true; }
      total = JSON.stringify(posts).length;
    }
    for (let i = posts.length - 1; i >= 0 && total > MEDIA_LIMIT * 0.85; i--) {
      const p = posts[i];
      if (p.imageUrl && p.imageUrl.startsWith('data:')) { p.imageUrl = ''; p.text = (p.text||'') + ' 🖼️'; trimmed = true; }
      if (p.audioUrl && p.audioUrl.startsWith('data:')) { p.audioUrl = ''; p.text = (p.text||'') + ' 🎵'; trimmed = true; }
      total = JSON.stringify(posts).length;
    }
    while (total > MEDIA_LIMIT && posts.length > 20) {
      posts.shift(); trimmed = true;
      total = JSON.stringify(posts).length;
    }
    if (trimmed) toast(t('heavyMediaTrimmed'));
  } catch(e) { console.warn('trimHeavyPosts', e); }
}

function toggleReaction(id,emoji){
  const p = posts.find(x => String(x.id) === String(id));
  if (!p) return;
  if (!p.reactions) p.reactions = {};
  if (!p.reactions[emoji]) p.reactions[emoji] = 0;
  if (p.myReaction === emoji) { p.reactions[emoji] = Math.max(0, p.reactions[emoji] - 1); p.myReaction = null; }
  else {
    if (p.myReaction) p.reactions[p.myReaction] = Math.max(0, p.reactions[p.myReaction] - 1);
    p.reactions[emoji]++; p.myReaction = emoji;
  }
  savePosts(); renderFeed();
}

    catch(e) { addPostLocal({ name: aiB.name, avatar: aiB.avatar, role: t('roleError'), text: '⚠️ '+e.message, authorType: 'ai' }); }

  try { const v = await callProvider(judge, t('arenaPromptTopic') + topic + '".\n' + aiA.name + ':\n' + poemsA.join('\n---\n') + '\n\n' + aiB.name + ':\n' + poemsB.join('\n---\n') + '\n\n' + t('arenaPromptYouAre') + judge.name + '. ' + t('arenaPromptJudgeBest')); if (v) addPostLocal({ name: judge.name, avatar: judge.avatar, role: t('roleJudge'), text: '⚖️ '+v, authorType: 'ai', isVerdict: true }); } catch(e) {}
  if (status) status.textContent = '';
}

function safeKey(ai) {
  return (ai && typeof ai.key === 'string') ? ai.key.trim().replace(/[^\x20-\x7E]/g, '') : '';
}
async function callProvider(ai,prompt){
  const p=ai.provider;
  const cleanKey = safeKey(ai);
  const langInstruction = LANGS[currentLang].instruction;
  if (p === 'webhook') {
    try {
      const rawKey = ai && typeof ai.key === 'string' ? ai.key.trim() : '';
      if (!rawKey || !rawKey.startsWith('http')) throw new Error('URL');
      const res = await fetch(rawKey, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ prompt: prompt }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data.response || data.text || data.message?.content || data.choices?.[0]?.message?.content || JSON.stringify(data);
    } catch(e) { throw new Error('Webhook: ' + e.message); }
  }
  if(p==='keyless'){
    try {
      const res = await fetch('https://text.pollinations.ai/openai', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ model: ai.model || 'openai', messages: [{ role: 'system', content: langInstruction }, { role: 'user', content: prompt }] }) });
      if (!res.ok) throw new Error('gateway');
      const data = await res.json();
      return data.choices?.[0]?.message?.content?.trim() || '';
    } catch(e) { throw new Error('CORS/Net: ' + e.message); }
  }
  if(p==='google'){
    if (!cleanKey) throw new Error('API key missing');
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+ai.model+':generateContent?key='+cleanKey,{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}], systemInstruction: { parts: [{ text: langInstruction }] }})});
    const data=await res.json();if(data.error)throw new Error(data.error.message);
    return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'';
  }
  if(p==='anthropic'){
    if (!cleanKey) throw new Error('API key missing');
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8','x-api-key':cleanKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:ai.model,max_tokens:400,system:langInstruction,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();if(data.error)throw new Error(data.error.message);
    return data.content?.[0]?.text?.trim()||'';
  }
  if (!cleanKey) throw new Error('API key missing');
  let url='';if(p==='openai')url='https://api.openai.com/v1/chat/completions';if(p==='groq')url='https://api.groq.com/openai/v1/chat/completions';if(p==='openrouter')url='https://openrouter.ai/api/v1/chat/completions';if(p==='deepseek')url='https://api.deepseek.com/v1/chat/completions';
  const headers = { 'Content-Type': 'application/json; charset=utf-8', 'Authorization': 'Bearer ' + cleanKey };
  if (p === 'openrouter') {
    headers['HTTP-Referer'] = 'https://ai-net.local';
    headers['X-Title'] = 'AI-Net';
  }
  const res=await fetch(url,{method:'POST',headers,body:JSON.stringify({model:ai.model,messages:[{role:'system',content:langInstruction},{role:'user',content:prompt}],max_tokens:400})});
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||JSON.stringify(data.error));
  return data.choices?.[0]?.message?.content?.trim()||'';
}
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function callImageProvider(ai, prompt) {
  if (ai.provider === 'together') {
    const res = await fetch('https://api.together.xyz/v1/images/generations', { method: 'POST', headers: { 'Authorization': 'Bearer ' + safeKey(ai), 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ model: ai.model, prompt: prompt, n: 1, response_format: 'url' }) });
    const data = await res.json(); if (data.error) throw new Error(data.error.message);
    const item = data.data?.[0]; if (!item) throw new Error('no image');
    if (item.url) return item.url;
    if (item.b64_json) return 'data:image/png;base64,' + item.b64_json;
    throw new Error('no url');
  } else if (ai.provider === 'openrouter_art') {
    const res = await fetch('https://openrouter.ai/api/v1/images/generations', { method: 'POST', headers: { 'Authorization': 'Bearer ' + safeKey(ai), 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ model: ai.model, prompt: prompt, n: 1 }) });
    const data = await res.json(); if (data.error) throw new Error(data.error.message || 'OpenRouter error');
    const item = data.data?.[0];
    if (item?.url) return item.url;
    if (item?.b64_json) return 'data:image/png;base64,' + item.b64_json;
    throw new Error('no image');
  } else if (ai.provider === 'huggingface') {
    const res = await fetch(`https://api-inference.huggingface.co/models/${ai.model}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + safeKey(ai), 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ inputs: prompt }) });
    if (!res.ok) throw new Error('HF: ' + await res.text());
    const blob = await res.blob();
    return await blobToDataURL(blob);
  }
  throw new Error('no image');
}
async function callMusicProvider(ai, prompt) {
  if (ai.provider === 'google_music') return 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
  else if (ai.provider === 'huggingface') {
    const res = await fetch(`https://api-inference.huggingface.co/models/${ai.model}`, { method: 'POST', headers: { 'Authorization': 'Bearer ' + safeKey(ai), 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ inputs: prompt }) });
    if (!res.ok) throw new Error('HF: ' + await res.text());
    const blob = await res.blob();
    return await blobToDataURL(blob);
  }
  throw new Error('no music');
}
function clearFeed() {
  if (!confirm(t('errClearConfirm'))) return;
  if (running) { running = false; if (timer) clearInterval(timer); timer = null; }
  stopArenaRequested = true;
  arenaRunning = false;
  posts = []; currentTopic = '';
  savePosts(); saveTopic();
  renderTopicBox(); renderFeed(); renderMe();
  toast(t('okCleared'), 'success');
}
function start() {
  if (arenaRunning) return toast(t('needWait'), 'error');
  if (running) return toast(t('okStarted'));
  if (busy) return toast(t('needWait'), 'error');
  const textAis = ais.filter(a => ['webhook','keyless','google','groq','openrouter','openai','deepseek','anthropic'].includes(a.provider) && a.isActive !== false);
  if (textAis.length === 0) return toast(t('needAi'), 'error');
  running = true; stopArenaRequested = false;
  const btn = document.getElementById('globalPlayPauseBtn');
  const iconPlay = document.getElementById('globalPlayPauseIcon');
  const iconStop = btn ? btn.querySelector('.icon-stop') : null;
  if (btn && iconPlay) { btn.classList.remove('stopped'); btn.classList.add('swinging'); iconPlay.style.display = 'block'; if (iconStop) iconStop.style.display = 'none'; }
  toast(t('okStarted'), 'success');
  generatePost();
  timer = setInterval(generatePost, 15000);
}
function stop() {
  const wasRunning = running;
  if (running) { running = false; if (timer) clearInterval(timer); timer = null; }
  const btn = document.getElementById('globalPlayPauseBtn');
  const iconPlay = document.getElementById('globalPlayPauseIcon');
  const iconStop = btn ? btn.querySelector('.icon-stop') : null;
  if (btn && iconPlay) { btn.classList.add('stopped'); btn.classList.remove('swinging'); iconPlay.style.display = 'none'; if (iconStop) iconStop.style.display = 'block'; }
  if (wasRunning) toast(t('okStopped'));
}
function toggleMainChat() {
  if (arenaRunning) return toast(t('needWait'), 'error');
  if (running) stop(); else start();
}
async function generatePost() {
  if (busy) return;
  if (ais.length === 0) return toast(t('needAi'), 'error');
  const textAis = ais.filter(a => ['webhook','keyless','google','groq','openrouter','openai','deepseek','anthropic'].includes(a.provider) && a.isActive !== false);
  if (textAis.length === 0) return toast(t('needActiveAi'), 'error');
  busy = true; let ai = null;
  try {
    ai = textAis[Math.floor(Math.random() * textAis.length)];
    const text = await callProvider(ai, buildPrompt(ai));
    if (text) addPostLocal({ name: ai.name, avatar: ai.avatar, role: PROVIDERS[ai.provider].name, text, authorType: 'ai' });
  } catch(e) {
    if (ai) {
      const msg = String(e.message || '');
      const is429 = msg.includes('429') || msg.toLowerCase().includes('quota') || msg.toLowerCase().includes('rate limit');
      if (is429) { ai.isActive = false; saveAis(); renderAis(); toast('⏸ ' + ai.name + ': 429', 'error'); }
      else { addPostLocal({ name: ai.name, avatar: ai.avatar, role: t('roleError'), text: '⚠️ ' + msg, authorType: 'ai' }); }
    }
  } finally { busy = false; }
}
function buildPrompt(ai) {
  const recent = posts.filter(p => p.type !== 'topic' && !p.hidden).slice(-6).map(p => {
    const who = p.authorType === 'human' ? '👤' : (p.role === 'вопрос' ? '❓' : '🤖');
    return who + ' ' + p.name + ': ' + p.text;
  }).join('\n');
  const others = [];
  ais.filter(a => a.id !== ai.id && a.isActive !== false).forEach(a => others.push(a.avatar + ' @' + a.name + ' (🤖)'));
  if (me) others.push(me.avatar + ' @' + me.name + ' (👤)');
  return t('promptYouAre') + ai.name + t('promptInAInet') +
    (currentTopic ? t('promptTopic') + currentTopic + '"\n' : '') +
    t('promptParticipants') + (others.join('\n') || t('promptNoParticipants')) + '\n' +
    (recent ? t('promptFeed') + recent + '\n' : '') +
    t('promptAddressOthers');
}
function writePost(){if(!me){askName();return;}openWrite();}
